name: CI

# Uses reusable workflows from ci-pipeline-kit instead of inlining the
# steps here — see https://github.com/Orhevba/ci-pipeline-kit. This also
# adds a security-scan stage (gosec + govulncheck) this project didn't
# have before. Deliberately NOT overriding go-version here — the kit
# defaults it to "stable" precisely so callers like this one don't need
# to track and re-pin a version number themselves (an earlier attempt at
# pinning "1.23" here went stale within the same session: it fixed one
# stdlib CVE but a dozen more surfaced the moment security-scan actually
# ran against this project's real dependency tree).

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    uses: Orhevba/ci-pipeline-kit/.github/workflows/go-lint.yml@master

  test:
    uses: Orhevba/ci-pipeline-kit/.github/workflows/go-test.yml@master

  security-scan:
    uses: Orhevba/ci-pipeline-kit/.github/workflows/go-security-scan.yml@master
    # The one exception to "stable" above: gosec@latest (v2.29.0, x/tools
    # v0.49.0) can't load packages built by Go 1.27 ("export data version 5 is
    # greater than maximum supported version 4"), so it fails on every package
    # with 0 findings. Scan with go.mod's own version until gosec catches up,
    # then drop this. go.mod's `toolchain go1.26.9` line makes the runner's
    # 1.26.8 switch to the patched 1.26.9 standard library.
    with:
      go-version: "1.26"

  # Only from master, and only once lint, tests and the security scan all passed.
  # Image: ghcr.io/orhevba/gitops-drift-detector (:<commit sha> and :latest).
  publish:
    needs: [lint, test, security-scan]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    uses: Orhevba/ci-pipeline-kit/.github/workflows/docker-build-push.yml@master
    with:
      image-name: gitops-drift-detector
      push: true
