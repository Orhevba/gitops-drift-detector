apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: watchedrepos.drift.tygacookie.dev
spec:
  group: drift.tygacookie.dev
  names:
    kind: WatchedRepo
    listKind: WatchedRepoList
    plural: watchedrepos
    singular: watchedrepo
    shortNames:
      - wr
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: In Sync
          type: boolean
          jsonPath: .status.inSync
        - name: Drift
          type: integer
          jsonPath: .status.driftCount
        - name: Last Checked
          type: string
          jsonPath: .status.lastChecked
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [repoURL, path, namespace]
              properties:
                repoURL:
                  type: string
                  description: Git repository to clone, e.g. https://github.com/org/repo.git
                branch:
                  type: string
                  description: Branch to check out. Defaults to the repo's default branch.
                path:
                  type: string
                  description: Path within the repo to the directory of YAML manifests.
                namespace:
                  type: string
                  description: Namespace in the cluster to compare the manifests against.
                pollInterval:
                  type: string
                  description: Duration between checks, e.g. "5m". Defaults to 5m.
                ignore:
                  type: array
                  description: "Kind/name entries excluded from orphan detection."
                  items:
                    type: string
                autoRemediate:
                  type: boolean
                  description: Apply Git's version automatically to fix MISSING/DRIFTED resources instead of only reporting them. Off by default.
                pruneOrphans:
                  type: boolean
                  description: Additionally delete resources not declared in Git. Has no effect unless autoRemediate is true. Off by default — destructive.
                gitCredentialsSecretRef:
                  type: object
                  description: "Reference to a Secret (same namespace as this WatchedRepo) holding an access token for a private repo. The token is passed to git through its environment only and sent only to repoURL, which must be https. Omit for public repos."
                  required: [name]
                  properties:
                    name:
                      type: string
                    key:
                      type: string
                      description: Defaults to "token" if unset.
                kubeconfigSecretRef:
                  type: object
                  description: "Reference to a Secret (same namespace as this WatchedRepo) containing a kubeconfig for a different cluster than the one the manager runs in. Omit to check the manager's own cluster."
                  required: [name]
                  properties:
                    name:
                      type: string
                    key:
                      type: string
                      description: Defaults to "kubeconfig" if unset.
            status:
              type: object
              properties:
                lastChecked:
                  type: string
                  format: date-time
                inSync:
                  type: boolean
                driftCount:
                  type: integer
                error:
                  type: string
                drift:
                  type: array
                  items:
                    type: object
                    properties:
                      kind:
                        type: string
                      name:
                        type: string
                      status:
                        type: string
                      detail:
                        type: string
