apiVersion: v1
kind: Namespace
metadata:
  name: drift-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-drift-detector
  namespace: drift-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitops-drift-detector
  template:
    metadata:
      labels:
        app: gitops-drift-detector
    spec:
      serviceAccountName: gitops-drift-detector
      containers:
        - name: manager
          # Built from the repo's Dockerfile. On a single-node k3s VM with
          # no registry, the simplest path is building the image directly
          # on that VM (or importing a tarball via `k3s ctr images import`)
          # rather than pushing/pulling through a registry.
          image: gitops-drift-detector:latest
          imagePullPolicy: IfNotPresent
          args:
            - --metrics-bind-address=:8080
            - --dashboard-bind-address=:8090
          ports:
            - name: dashboard
              containerPort: 8090
          env:
            # Created via:
            #   kubectl create secret generic gitops-drift-detector-telegram \
            #     -n drift-system \
            #     --from-literal=token=<bot-token> \
            #     --from-literal=chat-id=<chat-id>
            # Notifications are disabled (a no-op) if this secret doesn't
            # exist or the manager can't read it.
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitops-drift-detector-telegram
                  key: token
                  optional: true
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: gitops-drift-detector-telegram
                  key: chat-id
                  optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: gitops-drift-detector-dashboard
  namespace: drift-system
spec:
  # LoadBalancer, not the ClusterIP default: k3s ships a built-in lightweight
  # load balancer (Klipper) that, on a single-node cluster, binds this port
  # directly onto the node's own IP — so the dashboard becomes reachable at
  # http://<node-ip>:8090/ with no `kubectl port-forward` needed. The
  # dashboard has no authentication of its own, so this is fine on a private
  # home network but shouldn't be exposed further than that without adding some.
  type: LoadBalancer
  selector:
    app: gitops-drift-detector
  ports:
    - port: 8090
      targetPort: dashboard
